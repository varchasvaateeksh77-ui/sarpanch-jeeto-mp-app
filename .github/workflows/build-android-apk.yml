name: Build Signed Installable Android APK (SarpanchJeeto-MP-v1.0.apk)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'releases/**'
      - 'public/releases/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile & Sign Installable Android APK via Android SDK Build-Tools
        run: |
          set -e
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
          ANDROID_JAR="$PLATFORM/android.jar"
          echo "Using build-tools: $BUILD_TOOLS"
          echo "Using android.jar: $ANDROID_JAR"

          mkdir -p /tmp/apkbuild/src/com/sarpanchjeeto/mp /tmp/apkbuild/res/values /tmp/apkbuild/obj /tmp/apkbuild/apk

          cat << 'MANIFEST' > /tmp/apkbuild/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.sarpanchjeeto.mp"
              android:versionCode="1"
              android:versionName="1.0.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="सरपंच जीतो (म.प्र.)"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name="com.sarpanchjeeto.mp.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat << 'JAVA' > /tmp/apkbuild/src/com/sarpanchjeeto/mp/MainActivity.java
          package com.sarpanchjeeto.mp;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String APP_URL = "https://ais-pre-sj2p62ir3vqh6qrbvhzs6w-701800866090.asia-southeast1.run.app";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("tel:") || url.startsWith("mailto:") || url.startsWith("https://wa.me")) {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                              return true;
                          }
                          return false;
                      }
                  });
                  setContentView(webView);
                  webView.loadUrl(APP_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA

          cat << 'VALUES' > /tmp/apkbuild/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">सरपंच जीतो (म.प्र.)</string>
          </resources>
          VALUES

          "$BUILD_TOOLS/aapt" package -f -m \
            -J /tmp/apkbuild/src \
            -M /tmp/apkbuild/AndroidManifest.xml \
            -S /tmp/apkbuild/res \
            -I "$ANDROID_JAR"

          javac -source 11 -target 11 -cp "$ANDROID_JAR" \
            -d /tmp/apkbuild/obj \
            /tmp/apkbuild/src/com/sarpanchjeeto/mp/*.java

          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" \
            --output /tmp/apkbuild/apk \
            /tmp/apkbuild/obj/com/sarpanchjeeto/mp/*.class

          "$BUILD_TOOLS/aapt" package -f \
            -M /tmp/apkbuild/AndroidManifest.xml \
            -S /tmp/apkbuild/res \
            -I "$ANDROID_JAR" \
            -F /tmp/apkbuild/unsigned.apk \
            /tmp/apkbuild/apk

          "$BUILD_TOOLS/zipalign" -f 4 /tmp/apkbuild/unsigned.apk /tmp/apkbuild/aligned.apk

          keytool -genkeypair -v \
            -keystore /tmp/apkbuild/release.keystore \
            -alias sarpanchjeeto \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass sarpanch123 -keypass sarpanch123 \
            -dname "CN=Sarpanch Jeeto MP, OU=ElectionTech, O=SarpanchJeeto, L=Bhopal, S=MP, C=IN"

          mkdir -p releases public/releases
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/apkbuild/release.keystore \
            --ks-pass pass:sarpanch123 \
            --key-pass pass:sarpanch123 \
            --out releases/SarpanchJeeto-MP-v1.0.apk \
            /tmp/apkbuild/aligned.apk

          cp releases/SarpanchJeeto-MP-v1.0.apk public/releases/SarpanchJeeto-MP-v1.0.apk
          ls -lh releases/SarpanchJeeto-MP-v1.0.apk

      - name: Commit Signed Installable APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "varchasvaateeksh77@gmail.com"
          git add releases/SarpanchJeeto-MP-v1.0.apk public/releases/SarpanchJeeto-MP-v1.0.apk
          git diff --staged --quiet || (git commit -m "chore(apk): publish signed installable SarpanchJeeto-MP-v1.0.apk" && git push origin main)
