name: Build Signed Standalone Android APK (SarpanchJeeto-MP-v1.0.apk)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and build standalone web bundle (dist/)
        run: |
          npm install --legacy-peer-deps
          npm run build
          # Remove large optional walkthrough videos from APK assets copy to keep APK ~2MB and instant to install
          rm -rf dist/assets/aistudio/*.mp4 dist/releases

      - name: Compile, Package, Zipalign & Sign v1+v2+v3 Native Android APK
        run: |
          set -e
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM_JAR=$(ls $ANDROID_HOME/platforms/*/android.jar | sort -V | tail -n 1)
          echo "Using BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR"
          echo "Using PLATFORM_JAR=$PLATFORM_JAR"

          rm -rf /tmp/apk-build
          mkdir -p /tmp/apk-build/src/com/sarpanchjeeto/mp
          mkdir -p /tmp/apk-build/res/values
          mkdir -p /tmp/apk-build/res/drawable
          mkdir -p /tmp/apk-build/assets/www
          mkdir -p /tmp/apk-build/obj
          mkdir -p /tmp/apk-build/dex

          # Copy compiled standalone React app + 55 MP Districts places.json into assets/www/
          cp -r dist/* /tmp/apk-build/assets/www/

          # Create AndroidManifest.xml (Standalone Native App, minSdk 24, targetSdk 34, versionCode 3)
          cat << 'EOF' > /tmp/apk-build/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.sarpanchjeeto.mp"
              android:versionCode="3"
              android:versionName="1.1.0">

              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:label="सरपंच जीतो (म.प्र.)"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name="com.sarpanchjeeto.mp.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create Vector App Icon (@drawable/ic_launcher)
          cat << 'EOF' > /tmp/apk-build/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1E3A8A"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FBBF24"
                  android:pathData="M54,18 A36,36 0 1,1 53.9,18 Z"/>
              <path
                  android:fillColor="#1E3A8A"
                  android:pathData="M36,42 h36 v8 h-14 v24 h-8 v-24 h-14 z"/>
          </vector>
          EOF

          # Create MainActivity.java:
          #  1. Serves packaged assets/www/* over virtual HTTPS origin https://appassets.androidplatform.net/
          #     via shouldInterceptRequest so ES modules, fetch('/demo/places.json'), IndexedDB, and localStorage
          #     run 100% natively inside the app without ever opening an external browser or webpage.
          #  2. Provides native Java HttpURLConnection + AES-256-GCM decryption for ECI CAPTCHA & E-Roll verification.
          cat << 'EOF' > /tmp/apk-build/src/com/sarpanchjeeto/mp/MainActivity.java
          package com.sarpanchjeeto.mp;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.HashMap;
          import java.util.Map;

          import javax.crypto.Cipher;
          import javax.crypto.spec.GCMParameterSpec;
          import javax.crypto.spec.SecretKeySpec;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String ECI_AES_KEY_B64 = "e855n97lc4tcPkj7WWsi38yNWpalLBLZzQdkqHWYbZ0=";

              private static String decryptEciPayloadJava(String encryptedB64) throws Exception {
                  byte[] allBytes = Base64.decode(encryptedB64, Base64.DEFAULT);
                  byte[] keyBytes = Base64.decode(ECI_AES_KEY_B64, Base64.DEFAULT);
                  byte[] iv = new byte[12];
                  System.arraycopy(allBytes, 0, iv, 0, 12);
                  int cipherAndTagLen = allBytes.length - 12;
                  byte[] cipherAndTag = new byte[cipherAndTagLen];
                  System.arraycopy(allBytes, 12, cipherAndTag, 0, cipherAndTagLen);

                  Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                  SecretKeySpec keySpec = new SecretKeySpec(keyBytes, "AES");
                  GCMParameterSpec gcmSpec = new GCMParameterSpec(128, iv);
                  cipher.init(Cipher.DECRYPT_MODE, keySpec, gcmSpec);
                  byte[] plainBytes = cipher.doFinal(cipherAndTag);
                  return new String(plainBytes, StandardCharsets.UTF_8);
              }

              public class AndroidEciBridge {
                  @JavascriptInterface
                  public boolean isNativeAndroidApp() {
                      return true;
                  }

                  @JavascriptInterface
                  public String fetchEciCaptchaJson() {
                      try {
                          URL url = new URL("https://gateway-voters.eci.gov.in/api/v1/captcha-service/getCaptcha/EROLL");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          conn.setConnectTimeout(12000);
                          conn.setReadTimeout(12000);
                          conn.setRequestProperty("Accept", "application/json, text/plain, */*");
                          conn.setRequestProperty("Origin", "https://voters.eci.gov.in");
                          conn.setRequestProperty("Referer", "https://voters.eci.gov.in/");
                          conn.setRequestProperty("appName", "VSP");
                          conn.setRequestProperty("applicationName", "VSP");
                          conn.setRequestProperty("PLATFORM-TYPE", "ECIWEB");
                          conn.setRequestProperty("channelidobo", "VSP");

                          int code = conn.getResponseCode();
                          InputStream is = (code >= 200 && code < 300) ? conn.getInputStream() : conn.getErrorStream();
                          BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = br.readLine()) != null) {
                              sb.append(line);
                          }
                          br.close();
                          String rawJson = sb.toString();

                          // Extract "data":"..." and decrypt natively in Java using AES-256-GCM
                          int dataIdx = rawJson.indexOf("\"data\"");
                          if (dataIdx >= 0) {
                              int colonIdx = rawJson.indexOf(':', dataIdx);
                              int firstQuote = rawJson.indexOf('"', colonIdx + 1);
                              int secondQuote = rawJson.indexOf('"', firstQuote + 1);
                              if (firstQuote > 0 && secondQuote > firstQuote) {
                                  String encB64 = rawJson.substring(firstQuote + 1, secondQuote);
                                  return decryptEciPayloadJava(encB64);
                              }
                          }
                          return rawJson;
                      } catch (Exception e) {
                          return "{\"error\":\"" + e.getMessage() + "\"}";
                      }
                  }

                  @JavascriptInterface
                  public String verifyEciCaptchaJson(String payloadJson) {
                      try {
                          URL url = new URL("https://gateway-voters.eci.gov.in/api/v1/printing-publish/generate-published-eroll");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setDoOutput(true);
                          conn.setConnectTimeout(15000);
                          conn.setReadTimeout(15000);
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setRequestProperty("Accept", "application/json, text/plain, */*");
                          conn.setRequestProperty("Origin", "https://voters.eci.gov.in");
                          conn.setRequestProperty("Referer", "https://voters.eci.gov.in/");
                          conn.setRequestProperty("appName", "VSP");
                          conn.setRequestProperty("applicationName", "VSP");
                          conn.setRequestProperty("PLATFORM-TYPE", "ECIWEB");
                          conn.setRequestProperty("channelidobo", "VSP");

                          byte[] out = payloadJson.getBytes(StandardCharsets.UTF_8);
                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(out);
                          }

                          int code = conn.getResponseCode();
                          InputStream is = (code >= 200 && code < 300) ? conn.getInputStream() : conn.getErrorStream();
                          BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = br.readLine()) != null) {
                              sb.append(line);
                          }
                          br.close();
                          return "{\"httpStatus\":" + code + ",\"body\":" + sb.toString() + "}";
                      } catch (Exception e) {
                          return "{\"httpStatus\":502,\"body\":{\"status\":\"Error\",\"message\":\"" + e.getMessage() + "\"}}";
                      }
                  }
              }

              private String guessMimeType(String path) {
                  if (path.endsWith(".html")) return "text/html";
                  if (path.endsWith(".js") || path.endsWith(".mjs")) return "application/javascript";
                  if (path.endsWith(".css")) return "text/css";
                  if (path.endsWith(".json")) return "application/json";
                  if (path.endsWith(".svg")) return "image/svg+xml";
                  if (path.endsWith(".png")) return "image/png";
                  if (path.endsWith(".jpg") || path.endsWith(".jpeg")) return "image/jpeg";
                  if (path.endsWith(".woff2")) return "font/woff2";
                  return "application/octet-stream";
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      Window window = getWindow();
                      window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                      window.setStatusBarColor(Color.parseColor("#1E3A8A"));
                  }

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setUserAgentString(settings.getUserAgentString() + " SarpanchJeetoAndroidApp/1.1");

                  webView.addJavascriptInterface(new AndroidEciBridge(), "AndroidEciBridge");
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if (uri != null && "appassets.androidplatform.net".equals(uri.getHost())) {
                              String path = uri.getPath();
                              if (path == null || path.isEmpty() || "/".equals(path)) {
                                  path = "/index.html";
                              }
                              String assetPath = "www" + (path.startsWith("/") ? path : "/" + path);
                              try {
                                  InputStream is = getAssets().open(assetPath);
                                  String mime = guessMimeType(assetPath);
                                  WebResourceResponse resp = new WebResourceResponse(mime, "UTF-8", is);
                                  Map<String, String> headers = new HashMap<>();
                                  headers.put("Access-Control-Allow-Origin", "*");
                                  headers.put("Cache-Control", "no-cache");
                                  resp.setResponseHeaders(headers);
                                  return resp;
                              } catch (Exception ignored) {
                                  // SPA fallback to index.html for client routes
                                  try {
                                      InputStream indexIs = getAssets().open("www/index.html");
                                      return new WebResourceResponse("text/html", "UTF-8", indexIs);
                                  } catch (Exception ignored2) {}
                              }
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String u = request.getUrl().toString();
                          if (u.startsWith("https://appassets.androidplatform.net") || u.startsWith("file://")) {
                              return false;
                          }
                          if (u.startsWith("tel:") || u.startsWith("whatsapp:") || u.startsWith("https://wa.me/")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(u));
                                  startActivity(intent);
                              } catch (Exception ignored) {}
                              return true;
                          }
                          // Never open external browser for app navigation
                          return false;
                      }
                  });

                  setContentView(webView);
                  // Load packaged standalone app from APK assets over virtual HTTPS origin (never opens an external webpage)
                  webView.loadUrl("https://appassets.androidplatform.net/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # 1. Compile resources with aapt2
          $BUILD_TOOLS_DIR/aapt2 compile --dir /tmp/apk-build/res -o /tmp/apk-build/resources.zip
          $BUILD_TOOLS_DIR/aapt2 link \
            -I "$PLATFORM_JAR" \
            --manifest /tmp/apk-build/AndroidManifest.xml \
            --java /tmp/apk-build/src \
            -A /tmp/apk-build/assets \
            -o /tmp/apk-build/unaligned.apk \
            /tmp/apk-build/resources.zip

          # 2. Compile Java -> class -> classes.dex (with d8)
          javac -source 1.8 -target 1.8 -bootclasspath "$PLATFORM_JAR" -classpath "$PLATFORM_JAR" \
            -d /tmp/apk-build/obj \
            /tmp/apk-build/src/com/sarpanchjeeto/mp/R.java \
            /tmp/apk-build/src/com/sarpanchjeeto/mp/MainActivity.java

          $BUILD_TOOLS_DIR/d8 --lib "$PLATFORM_JAR" --output /tmp/apk-build/dex /tmp/apk-build/obj/com/sarpanchjeeto/mp/*.class

          # 3. Add classes.dex into unaligned.apk
          cd /tmp/apk-build/dex
          zip -uj /tmp/apk-build/unaligned.apk classes.dex
          cd -

          # 4. Zipalign on 4-byte boundaries
          $BUILD_TOOLS_DIR/zipalign -p -f -v 4 /tmp/apk-build/unaligned.apk /tmp/apk-build/aligned.apk

          # 5. Generate Release Keystore & Sign with APK Signature Scheme v1 + v2 + v3
          keytool -genkeypair -v \
            -keystore /tmp/apk-build/release.keystore \
            -alias sarpanchjeeto \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass sarpanch123 -keypass sarpanch123 \
            -dname "CN=Sarpanch Jeeto MP, OU=ElectionTech, O=SarpanchJeeto, L=Bhopal, ST=MP, C=IN"

          mkdir -p public/releases
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks /tmp/apk-build/release.keystore \
            --ks-key-alias sarpanchjeeto \
            --ks-pass pass:sarpanch123 \
            --key-pass pass:sarpanch123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out public/releases/SarpanchJeeto-MP-v1.0.apk \
            /tmp/apk-build/aligned.apk

          $BUILD_TOOLS_DIR/apksigner verify --verbose public/releases/SarpanchJeeto-MP-v1.0.apk
          cp public/releases/SarpanchJeeto-MP-v1.0.apk ./SarpanchJeeto-MP-v1.0.apk
          ls -lh public/releases/SarpanchJeeto-MP-v1.0.apk

      - name: Commit Signed Standalone APK to Repository & Create GitHub Release
        run: |
          git config user.name "varchasvaateeksh77-ui"
          git config user.email "varchasvaateeksh77-ui@users.noreply.github.com"
          git add public/releases/SarpanchJeeto-MP-v1.0.apk SarpanchJeeto-MP-v1.0.apk
          git diff --staged --quiet || (git commit -m "chore(release): build v1+v2+v3 signed standalone Android APK with embedded HTTPS asset server [skip ci]" && git push origin HEAD:main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
